name: CI-CD Pipeline

# Runs on:
# - any push to develop or main
# - any pull request targeting develop or main
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/express-cicd-demo

jobs:

  # ---------- 1. RUN UNIT TESTS ----------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ---------- 2. SECRET SCAN (GitLeaks) ----------
  gitleaks:
    name: Scan for Leaked Secrets
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 3. BUILD DOCKER IMAGE + TRIVY SCAN ----------
  build-and-scan:
    name: Build Image and Scan with Trivy
    runs-on: ubuntu-latest
    needs: [test, gitleaks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (local only, not pushed yet)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./app

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          # Fail the pipeline only on HIGH/CRITICAL vulnerabilities
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  # ---------- 4. PUSH IMAGE TO DOCKER HUB ----------
  push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-scan
    # Only push on an actual push event (not on pull requests)
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}

  # ---------- 5. DEPLOY TO STAGING (develop branch) ----------
  deploy-staging:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop express-app || true
            docker rm express-app || true
            docker run -d --name express-app -p 80:3000 --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------- 6. DEPLOY TO PRODUCTION (main branch, needs manual approval) ----------
  deploy-production:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main'
    # This "environment" is what makes GitHub pause and wait for approval.
    # You configure required reviewers on this environment in repo Settings.
    environment:
      name: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop express-app || true
            docker rm express-app || true
            docker run -d --name express-app -p 80:3000 --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}
